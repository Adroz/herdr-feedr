name: Release

# Pushing a `v<version>` tag publishes the prebuilt binaries scripts/fetch-or-build.sh
# downloads: one `herdr-feedr-<triple>` per platform plus a SHA256SUMS covering them all.
# Platforms without an asset here (Linux arm64, Windows) build from source on install.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.triple }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-latest
            triple: x86_64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Never publish binaries for a version the cloned source doesn't declare:
      # fetch-or-build.sh picks its download by the Cargo.toml version.
      - name: Verify tag matches Cargo.toml and herdr-plugin.toml versions
        run: sh scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install musl tools
        if: matrix.triple == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The tag's source must pass the suite on this OS before its binary ships.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.triple }}

      - name: Stage asset + checksum
        shell: bash
        run: |
          asset="herdr-feedr-${{ matrix.triple }}"
          mkdir -p dist
          cp "target/${{ matrix.triple }}/release/feedr" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets + SHA256SUMS
        run: |
          mkdir -p release
          find artifacts -type f -name 'herdr-feedr-*' ! -name '*.sha256' -exec cp {} release/ \;
          cat artifacts/*/*.sha256 > release/SHA256SUMS
          ls -l release
          cat release/SHA256SUMS

      # Create-or-update, so re-running a failed workflow for the same tag just re-uploads.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
