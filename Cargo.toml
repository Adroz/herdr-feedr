[package]
name = "feedr"
version = "0.1.0"
edition = "2021"
description = "The feed rack for your herd — markdown to-do list shared with coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tempfile = "3"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
