# herdr-plugin.toml — manifest for the herdr-feedr plugin.
#
# The feed rack for your herd: a markdown-backed to-do sidebar, shared between you and
# your coding agents, docked in a herdr split pane. Conventions here follow the installed
# herdr-file-viewer plugin (~/.config/herdr/plugins/github/herdr-file-viewer-*/); the
# differences are v1 scope choices, noted inline below.
#
# v1 is linux/macos only (no Windows [[build]]/[[actions]] entries — see README).
# v1 also has no prebuilt-binary fetch path (scripts/build.sh always builds from source
# with cargo; see its header for a TODO referencing file-viewer's fetch-or-build.sh).

id = "herdr-feedr"
name = "herdr-feedr"
version = "0.1.0"
description = "The feed rack for your herd: a markdown-backed to-do sidebar for Herdr, shared between you and your coding agents."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Build step herdr runs at `plugin link`/`plugin install` time (and again on
# reinstall-to-update): compiles the `feedr` binary the pane and launcher scripts run.
[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/build.sh"]

# The sidebar pane. herdr performs the split placement on launch; the [[actions]] below
# summon it (open/focus/close) and do the left-edge dock (swap-walk + resize) that herdr's
# plugin pane system has no native support for — see scripts/open-feedr.sh.
[[panes]]
id = "feedr-sidebar"
title = "feedr"
placement = "split"
command = ["./target/release/feedr", "sidebar"]

# Open (or focus, if already open) the sidebar, docked to the left edge. Bind this to a
# keybinding in ~/.config/herdr/config.toml (see README's "Install as a herdr plugin").
[[actions]]
id = "open-feedr"
platforms = ["linux", "macos"]
title = "Open feedr"
description = "Open or focus the feedr sidebar, docked to the left edge of the current tab."
command = ["bash", "scripts/open-feedr.sh"]

# Close the sidebar if it's open; otherwise open it (same dock behavior as open-feedr).
[[actions]]
id = "toggle-feedr"
platforms = ["linux", "macos"]
title = "Toggle feedr"
description = "Close the feedr sidebar if it's open, otherwise open it."
command = ["bash", "scripts/toggle-feedr.sh"]

# Plan 3 auto-dock: when a user's own ~/Library/Application Support/herdr-feedr/config.toml
# (macOS; ~/.config/herdr-feedr/ on Linux) has `[sidebar] auto_dock = true`, dock a
# feedr-sidebar pane into every newly-created tab. herdr's manifest-level [[events]] hook
# is the real mechanism for this in 0.9.0 -- verified live via `herdr api schema --json`
# (InstalledPluginInfo.events / PluginManifestEventHook { on, command, platforms }) and
# herdr.dev/docs/plugins (whose own worked example uses exactly this shape). The installed
# herdr-file-viewer plugin's manifest comment ("there is no [[events]] hook (AC-N4)")
# documents THAT plugin's choice not to use this mechanism -- not that it's unavailable.
[[events]]
on = "tab.created"
platforms = ["linux", "macos"]
command = ["bash", "scripts/on-tab-created.sh"]
